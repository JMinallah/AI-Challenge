<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stepsy - Register</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="landing-body">
    <div class="landing-bg"></div>
    <div class="page-shell">
      <header class="site-nav">
        <a class="brand" href="index.html">Stepsy</a>
        <nav class="nav-links" aria-label="Primary">
          <a href="index.html">Home</a>
          <a href="login.html">Login</a>
        </nav>
      </header>

      <main class="site-main auth-page">
        <section class="auth-panel auth-panel--center">
          <p class="eyebrow">Create a New account</p>
          <form class="stack" data-form="sign-up" autocomplete="on">
            <label>
              Full name
              <input type="text" name="fullName" placeholder="Your name" required />
            </label>
            <label>
              Email
              <input type="email" name="registerEmail" placeholder="you@example.com" required />
            </label>
            <label>
              Password
              <div class="password-wrapper">
                <input type="password" name="registerPassword" placeholder="Create a password" required />
                <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon">
                    <path class="eye" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle class="pupil" cx="12" cy="12" r="3"></circle>
                    <path class="slash" d="M2.5 2.5l19 19" stroke-width="2" style="opacity: 0;"></path>
                  </svg>
                </button>
              </div>
            </label>
            <button class="button button--primary" type="submit">Register</button>
            <button class="button button--secondary" type="button" data-action="google-sign-in">Continue with Google</button>
          </form>
          <p class="auth-status" data-status></p>

          <p class="auth-note-text">Already have an account? <a href="login.html">Login here</a>.</p>
        </section>
      </main>
    </div>
    <script type="module" src="assets/js/auth.js"></script>
  </body>
</html>
