<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stepsy - Lessons</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-nav">
        <a class="brand" href="index.html">Stepsy</a>
        <nav class="nav-links" aria-label="Primary">
          <a href="lessons.html" aria-current="page">Lessons</a>
          <a href="progress.html">Progress</a>
          <a href="#" data-action="logout">Logout</a>
        </nav>
      </header>

      <main class="site-main site-main--app">
        <section class="page-intro">
          <p class="eyebrow">Learning Path</p>
          <h1>Week 1 Lessons</h1>
          <p class="section-copy">Pick up where you left off and complete one focused lesson at a time.</p>
        </section>

        <section class="metric-grid" aria-label="Lesson stats">
          <article class="metric-box">
            <p>Completed</p>
            <strong id="completedCount">0 / 0</strong>
          </article>
          <article class="metric-box">
            <p>Current streak</p>
            <strong id="currentStreak">0 days</strong>
          </article>
          <article class="metric-box">
            <p>Next lesson</p>
            <strong id="nextLesson">-</strong>
          </article>
        </section>

        <section class="list-shell" aria-label="Lesson list" id="lessonsList">
          <p class="auth-status" id="lessonsState">Loading lessons...</p>
        </section>

        <nav class="pagination-controls" aria-label="Pagination" style="display: flex; justify-content: center; align-items: center; gap: 16px; margin: 24px 0;">
          <button class="button button--secondary" id="pagePrevBtn" disabled>Previous</button>
          <span style="color: var(--muted); font-size: 0.95rem; font-weight: 600;" id="pageIndicator">Page 1</span>
          <button class="button button--secondary" id="pageNextBtn" disabled>Next</button>
        </nav>
      </main>
    </div>
    <script type="module" src="assets/js/lessons.js"></script>
  </body>
</html>
