<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stepsy - Login</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="landing-body">
    <div class="landing-bg"></div>
    <div class="page-shell">
      <header class="site-nav">
        <a class="brand" href="index.html">Stepsy</a>
        <nav class="nav-links" aria-label="Primary">
          <a href="index.html">Home</a>
          <a href="register.html">Register</a>
        </nav>
      </header>

      <main class="site-main auth-page">
        <section class="auth-panel auth-panel--center">
          <p class="eyebrow">Welcome back</p>

          <form class="stack" data-form="sign-in" autocomplete="on">
            <label>
              Email
              <input type="email" name="email" placeholder="you@example.com" required />
            </label>
            <label>
              Password
              <input type="password" name="password" placeholder="••••••••" required />
            </label>
            <button class="button button--primary" type="submit">Login</button>
            <button class="button button--secondary" type="button" data-action="google-sign-in">Continue with Google</button>
          </form>
          <p class="auth-status" data-status></p>
          <p class="auth-note-text">Need a new account? <a href="register.html">Register here</a>.</p>
        </section>
      </main>
    </div>
    <script type="module" src="assets/js/auth.js"></script>
  </body>
</html>
